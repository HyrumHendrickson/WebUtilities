name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool is affected?
      placeholder: File converter
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the tool
        2. Choose ...
        3. See the error
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: The Browser info tool can copy these details for you.
      placeholder: Chrome 130 on macOS 15
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste any errors from the browser developer console.
      render: text
  - type: textarea
    id: files
    attributes:
      label: Sample file or input
      description: Attach a small file that reproduces the problem, if one is involved. Do not share private data.
