<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Utilities</title>
    <meta
      name="description"
      content="Free, private browser tools: QR codes, image and PDF conversion, passwords, hashing, formatters, and more. Nothing is uploaded."
    />
    <meta name="theme-color" content="#f1f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1626" media="(prefers-color-scheme: dark)" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="assets/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script src="js/theme-init.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app">
      <header class="topbar">
        <button
          type="button"
          class="icon-btn menu-toggle"
          id="menu-toggle"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Toggle tool menu"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <a class="brand" href="#/" aria-label="Web Utilities home">
          <img src="assets/icons/icon-64.png" width="38" height="38" alt="" />
          <span>Web Utilities</span>
        </a>
        <div class="search" role="search">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4.2-4.2" />
          </svg>
          <input
            id="search"
            type="search"
            placeholder="Search tools"
            aria-label="Search tools"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd aria-hidden="true">/</kbd>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Change theme"></button>
      </header>

      <nav class="sidebar" id="sidebar" aria-label="Tools"></nav>
      <div class="scrim" id="scrim"></div>

      <main id="main" tabindex="-1">
        <noscript><p>Web Utilities needs JavaScript to run its tools. Nothing is sent to a server.</p></noscript>
      </main>

      <footer class="footer">
        <p>
          Web Utilities is open source under the MIT License. Files and text you use here are processed on your device
          and never uploaded.
        </p>
      </footer>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
